<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/ex4_2.css">
    <title>Cálculo do Peso Ideal</title>
</head>
<body>

    <main class="container">

        <section class="cabecalho">
            <h1>Cálculo do Peso Ideal</h1>

            <p>
                Informe seus dados abaixo para calcular uma
                estimativa do seu peso ideal.
            </p>

        </section>


        <form>
            <div class="campo">

                <label for="inName">Nome</label>

                <input type="text" id="inName" placeholder="Digite seu nome" required>

            </div>

            <div class="campo">

                <label>Sexo</label>

                <div class="opcoes-sexo">

                    <label class="opcao">

                        <input type="radio" name="sexo" id="inMasculino" required>
                        <span>Masculino</span>
                    </label>

                    <label class="opcao">

                        <input type="radio" name="sexo" id="inFeminino" required>
                        <span>Feminino</span>
                    </label>

                </div>

            </div>


            <div class="campo">

                <label for="inAltura">Altura</label>

                <div class="altura">

                    <input type="number" id="inAltura" placeholder="Ex.: 1.75" step="0.01" min="0.5" max="2.5" required>

                    <span>m</span>

                </div>

                <small>Digite sua altura em metros.</small>

            </div>


            <div class="botoes">

                <input type="submit" value="Calcular">

                <input type="reset" value="Limpar">

            </div>

        </form>


        <section id="resultado" class="resultado">

            <span class="resultado-titulo">
                RESULTADO
            </span>

            <h2></h2>

            <p></p>

        </section>


        <footer>
            <p>
                Este cálculo apresenta apenas uma estimativa.
            </p>
        </footer>

    </main>


    <script src="js/ex4_2.js"></script>
</body>
</html>
